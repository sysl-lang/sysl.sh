# Run every program on every page against the compiler this site documents.
#
# This job is the reason the pages can leave the compiler's repository at all. Nothing else checks
# that a fenced block still compiles: a page that has rotted looks exactly like a page that has not.
#
# It runs on a schedule as well as on pushes, and that is deliberate. The other two triggers fire
# when *this* repository changes, and the failure mode worth catching is the opposite one — the
# compiler moved, a release was cut, and nothing here has been touched since. A weekly run turns
# that from something somebody has to remember into something the repository notices.

name: Test

# Both branches, and for different reasons: `dev` is checked against the **interim** compiler so that
# a page for an unreleased feature is verified rather than drafted blind, and `stable` against the
# **released** one so that what the world reads is known to compile with the compiler people have.
on:
  push:
    branches: ["dev", "stable"]
  pull_request:
    branches: ["dev", "stable"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# `packages: read` is what lets the GitHub Packages resolver in `build.sbt` be reached at all. It is
# only needed in the window where Central has not propagated a new release yet — but that window is
# exactly when somebody has bumped `syslVersion`, so it is the one occasion the fallback exists for.
permissions:
  contents: read
  packages: read

concurrency:
  group: "test-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v5
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('build.sbt', 'project/**') }}
          restore-keys: ${{ runner.os }}-sbt-

      # A page with an `output` block is a whole compile, link and run. `llvm-ar` is wanted as well
      # as clang: building the standard module into an artifact goes through an archiver.
      #
      # **The version is pinned, and it has to be.** sysl emits textual LLVM IR naming intrinsics in
      # the spelling of the LLVM it was written against -- `llvm.va_start.p0`, the overloaded form.
      # An older LLVM does not recognise that name as an intrinsic at all: it accepts the module,
      # treats the call as an ordinary external, and the link fails with `undefined reference to
      # llvm.va_start.p0`. That is a version disagreement wearing a linker error, and the
      # distribution's default `clang` is whatever the distribution chose -- which is what the three
      # varargs pages on `reference/ffi` were failing on. The compiler's own CI pins the same way.
      - name: Install the toolchain
        env:
          LLVM_VERSION: "20"
        run: |
          set -euo pipefail
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y "llvm-$LLVM_VERSION"
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"

      # Printed rather than assumed. The failure this pins against is a disagreement between what
      # sysl emits and what the toolchain understands, and the first thing anyone reading a failed
      # run needs is which toolchain it was.
      - name: Report the toolchain
        run: |
          which clang llvm-ar
          clang --version | head -2
          llvm-ar --version | head -2

      # The published jar carries the compiler and NOT the standard library, which the compiler reads
      # off disk — so it has to come from somewhere, at exactly the version the jar is.
      #
      # It comes from the compiler's repository, sparsely, **at whatever commit `syslVersion` names**.
      # The release tarball is not usable here because its assets are per-platform
      # (`sysl-0.0.3-darwin-arm64.tar.gz`) and this runner is not that platform — the library is plain
      # `.sysl` source and has no platform, so downloading a machine's binary distribution to extract
      # text out of it would be the wrong shape of answer.
      #
      # **Two spellings of "whatever commit", because `dev` may pin an interim.** A release is
      # `0.0.40` and the ref is the tag `v0.0.40`. An interim published from the compiler's own `dev`
      # is `0.0.41-abc1234`, which is not tagged and never will be — but the suffix **is** the commit
      # it was built from, which is exactly what that stamp was introduced to buy. So the ref is the
      # tag for a release and the sha for an interim, and both are exact.
      #
      # Before this, `ref: v${version}` was the only form and an interim pin failed the checkout with
      # a message about an unknown ref. Nothing had noticed, because `dev` had only ever pinned
      # releases — so the half of the dev/stable split that lets a page be written while the feature
      # is still on `dev` had never once been exercised from this end.
      - name: Read the compiler under test
        id: sysl
        run: |
          set -euo pipefail
          version=$(sed -n 's/^val syslVersion = "\(.*\)"$/\1/p' build.sbt)
          test -n "$version"

          case "$version" in
            *-*) ref="${version#*-}"; kind="interim" ;;
            *)   ref="v$version";     kind="release" ;;
          esac

          echo "documenting sysl $version ($kind, from $ref)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # **Cloned by hand rather than with `actions/checkout`, and the reason is the interim.** That
      # action recognises a SHA only when it is the full forty characters; anything shorter is taken
      # as a branch or tag *name*, so an interim's eight-character stamp made it fetch
      # `refs/heads/f1244557*` and `refs/tags/f1244557*`, match nothing, and fail after three tries.
      # A short SHA cannot be asked for over the wire either — a fetch's want-line needs a full
      # object id — so the answer is an ordinary blobless clone, which carries the history and lets
      # git resolve the abbreviation locally. Sparse keeps it to the one directory that is wanted.
      #
      # Both directory names are asked for: the library was `lib/` until it was renamed `library/`,
      # and `syslVersion` may name a commit on either side of that.
      # `grammars` comes along for the same reason the library does. The highlighting grammar was
      # this repository's until `weave` needed it, and it now lives beside the `SyslLexical` it is a
      # claim about, where the test reconciling the two can see both. Fetching it here is what keeps
      # the site and the compiler colouring sysl by one grammar rather than two.
      - name: Fetch the standard library at that commit
        run: |
          set -euo pipefail

          git clone --filter=blob:none --sparse https://github.com/sysl-lang/sysl sysl-src
          git -C sysl-src sparse-checkout set library lib grammars
          git -C sysl-src checkout --detach "${{ steps.sysl.outputs.ref }}"

      # `lib/` locally whichever it was called upstream, because `build.sbt` points `SYSL_LIB` at that
      # path and the variable names a root outright — what the directory is called here is this
      # repository's business and nobody else's.
      - name: Put the library where the build looks for it
        run: |
          set -euo pipefail

          if [ -d sysl-src/library ]; then mv sysl-src/library lib
          else mv sysl-src/lib lib
          fi

          test -d lib/sysl

      # **The grammar is checked rather than copied, and that is deliberate.** It lives in the
      # compiler now, beside the `SyslLexical` it is a claim about and the test that reconciles the
      # two — but `docs.yml` builds the published site from this repository alone and fetches
      # nothing, so the committed copy here is what the site actually renders with and cannot be
      # replaced by one that only exists during a test run.
      #
      # So the two are diffed. Overwriting would be worse than duplicating: the tests would pass
      # against the compiler's grammar while the deploy shipped this one, and a drift between them
      # would be invisible in exactly the runs meant to catch it.
      #
      # Skipped where the compiler predates the move, since `syslVersion` may name a commit from
      # before the grammar lived there at all.
      - name: Check the grammar has not drifted from the compiler's
        run: |
          set -euo pipefail

          if [ ! -f sysl-src/grammars/sysl.tmLanguage.json ]; then
            echo "this compiler predates the grammar moving into it — nothing to check against"
            exit 0
          fi

          if ! diff -u sysl-src/grammars/sysl.tmLanguage.json docs/grammars/sysl.tmLanguage.json; then
            echo
            echo "docs/grammars/sysl.tmLanguage.json differs from the compiler's."
            echo "The compiler's is canonical — copy it over and commit."
            exit 1
          fi

      # **`GITHUB_TOKEN` has to be passed in explicitly.** Actions does not put it in a step's
      # environment the way it does `GITHUB_ACTOR` and the rest — it exists only as
      # `secrets.GITHUB_TOKEN` until a step asks for it. `build.sbt`'s fallback reads `sys.env`, so
      # without this it finds nothing, sends no credentials, and GitHub Packages answers 401.
      #
      # That is not hypothetical: it is what happened on 2026-08-06 releasing 0.0.9, the first time
      # anything actually reached the resolver. The fallback had been written against the belief that
      # "CI has GITHUB_TOKEN", which is true of the workflow and false of the step, so it had never
      # once worked.
      - name: Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sbt test
