# Build & deploy the sysl documentation site.
#
#   Push to `dev`        → builds and deploys to GitHub Pages.
#   PR targeting `dev`   → builds only, as a sanity check.
#   workflow_dispatch    → manual trigger from the Actions tab.
#
# `dev` rather than `stable` to match the compiler's repository, where `dev` is the default branch
# and what a merged feature lands on.
#
# The site is built by juicer, which lives in its own repository and has no published launcher — so
# this workflow checks juicer out beside the site and runs it from its own sbt project. When juicer
# ships a runnable artifact, the two checkout steps collapse into one and the build step loses its
# `working-directory`.

name: Docs

# **Both branches build; only `stable` deploys.** `dev` documents the language as it is on sysl's dev
# and is checked here so a page is never written blind; `stable` documents the released language and is
# what the world reads. See the `deploy` job for why they came apart.
on:
  push:
    branches: ["dev", "stable"]
  pull_request:
    branches: ["dev", "stable"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "docs-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v6
        with:
          path: site

      - name: Check out juicer
        uses: actions/checkout@v6
        with:
          repository: edadma/juicer
          ref: stable
          path: juicer

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # actions/setup-java does NOT ship sbt — the runner image only has the
      # JDK after the previous step.
      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v5
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('juicer/**/build.sbt', 'juicer/project/**') }}
          restore-keys: ${{ runner.os }}-sbt-

      # juicer's asset pipeline shells out to `sass` and `esbuild`. Without them
      # on PATH it degrades to the committed `static/` copies and skips
      # fingerprinting, which ships stale CSS and defeats cache busting.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install asset toolchain (sass + esbuild)
        run: npm install -g sass esbuild

      - name: Build the site
        working-directory: juicer
        run: >
          sbt 'juicerJVM/run build
          -s ${{ github.workspace }}/site/docs
          -d ${{ github.workspace }}/_site
          -b https://sysl.sh/'

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: _site

      # **This guard has to name the same branch `deploy` does**, and it is easy to miss when that
      # branch changes: the deploy job's own `if:` is the obvious one, and a build that skips this
      # step is perfectly green. What fails is `deploy`, on *"No artifacts named github-pages were
      # found for this workflow run"* — which reads as a problem with the deploy action rather than as
      # a step that never ran. Caught exactly that way on 2026-08-09, moving the deploy to `stable`.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/stable'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # **`stable`, not `dev`** — the site the world reads documents the *released* language, and dev no
  # longer tracks it.
  #
  # Until 2026-08-09 the two were one branch, which forced a rule that cost real time: a page for a
  # feature still on sysl's dev could not be written here at all, because `DocsTests` compiles every
  # fenced block with the pinned compiler and no released compiler had the feature. Pages were drafted
  # blind on a branch, ungated, and held until the release.
  #
  # Now `dev` pins an **interim** compiler published from sysl's dev, so a page is written and
  # *verified* the moment the feature exists. A release merges dev into stable in both repositories,
  # which is the one moment the two say the same thing.
  deploy:
    if: github.ref == 'refs/heads/stable'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # **Ten minutes is this action's hard maximum and cannot be raised.** Asking for more is not an
      # error and not a failure -- it is silently clamped, and the only trace is a line in the log:
      #
      #     Warning: timeout value is greater than the allowed maximum -
      #     timeout set to the maximum of 600000 milliseconds.
      #
      # So the obvious repair for a slow Pages service is not available, and writing `timeout:` here
      # buys nothing but a comment that lies. Tried on 2026-08-06 cutting 0.0.15, when four
      # deployments in a row sat in the Pages service past ten minutes and were cancelled by this
      # action on its way out -- build green every time, correct 1.9 MB `github-pages` artifact
      # selected every time, and the previous release's deployment had taken five minutes.
      #
      # What is left when Pages is slow is to wait for it and re-run. Nothing in this repository
      # fixes it.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
